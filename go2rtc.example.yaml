# ==========================================
# go2rtc Streaming Gateway Configuration Template
# Xiaomi Outdoor Camera CW100 Dual (2.5K Ultra HD)
# ==========================================

api:
  listen: ":1984"
  origin: "*"

rtsp:
  listen: ":8554"

webrtc:
  listen: ":8555"
  candidates:
    - YOUR_SERVER_IP:8555

ffmpeg:
  bin: "ffmpeg"
  h264: "-c:v libx264 -preset:v ultrafast -tune:v zerolatency -threads 2 -b:v 2500k -maxrate 3500k -bufsize 3500k -profile:v high -level:v 4.2"

# Session PassToken Xiaomi Cloud (Didapatkan dari Xiaomi Cloud Tokens Extractor)
xiaomi:
  "YOUR_XIAOMI_USER_ID": "YOUR_ENCRYPTED_PASSTOKEN_V1"

streams:
  # Lensa 1 (Primary / Wide Angle - Native 2.5K Ultra HD)
  cctv_lensa_kiri:
    - xiaomi://YOUR_XIAOMI_USER_ID:sg@YOUR_CAMERA_IP?did=YOUR_CAMERA_DID&model=chuangmi.camera.075ae1&shared=1&subtype=3
  cctv_garasi_kiri:
    - cctv_lensa_kiri
  cctv_garasi_left:
    - cctv_lensa_kiri

  # Lensa 2 (Secondary / PTZ Lens - Native 2.5K Ultra HD)
  cctv_lensa_kanan:
    - xiaomi://YOUR_XIAOMI_USER_ID:sg@YOUR_CAMERA_IP?did=YOUR_CAMERA_DID&model=chuangmi.camera.075ae1&channel=2&shared=1&subtype=3
  cctv_garasi_kanan:
    - cctv_lensa_kanan
  cctv_garasi_right:
    - cctv_lensa_kanan
